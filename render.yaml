services:
  - type: web
    name: restaurantos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-production.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py setup_roles
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_SETTINGS_MODULE
        value: core.production_settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: ORDER_DEMO_ENABLED
        value: "True"
      - key: PRODUCTION_DEMO_ENABLED
        value: "True"
      - key: PAYMENTS_ENABLED
        value: "False"
